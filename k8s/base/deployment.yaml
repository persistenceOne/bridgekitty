apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridgekitty-backend
  labels:
    app: bridgekitty-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bridgekitty-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bridgekitty-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/persistenceone/bridgekitty-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: bridgekitty-config
            - secretRef:
                name: bridgekitty-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: ghcr-pull-secret
