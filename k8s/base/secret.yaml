apiVersion: v1
kind: Secret
metadata:
  name: bridgekitty-secrets
  labels:
    app: bridgekitty-backend
type: Opaque
stringData:
  # Wallet address to receive affiliate fees
  FEE_RECIPIENT_ADDRESS: "0xYOUR_FEE_WALLET_ADDRESS"
  
  # Aggregator API keys
  LIFI_API_KEY: "your-lifi-api-key"
  SQUID_INTEGRATOR_ID: "your-squid-integrator-id"
  
  # Optional: Override fee percentages (if different from ConfigMap defaults)
  # LIFI_FEE_PERCENT: "1.0"
  # DEBRIDGE_FEE_BPS: "100"
  # RELAY_FEE_BPS: "100"
  # ACROSS_FEE_BPS: "50"
  # SQUID_FEE_PERCENT: "1.0"
---
# NOTE: Create this secret with actual values in your cluster:
# kubectl create secret generic bridgekitty-secrets \
#   --from-literal=FEE_RECIPIENT_ADDRESS=0x... \
#   --from-literal=LIFI_API_KEY=... \
#   --from-literal=SQUID_INTEGRATOR_ID=... \
#   -n <namespace>
